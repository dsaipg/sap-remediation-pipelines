version: 2

models:
  - name: financial_transactions
    description: >
      Consolidated financial transaction fact table (S/4HANA).
      Sources from stg_acdoca (flat — replaces stg_bkpf + stg_bseg join).
      Enriched with GL accounts (stg_ska1_s4) and cost centers (stg_csks_s4).
      Each row represents one journal line item with full context.
      PRIMARY table consumed by the finance dashboard.
    columns:
      - name: document_number
        tests: [not_null]
      - name: line_item_number
        tests: [not_null]
      - name: posting_date
        tests: [not_null]
      - name: gl_account_number
        tests: [not_null]
      - name: signed_amount_local
        tests: [not_null]

  - name: financial_master_data
    description: >
      Unified financial master data dimension table (S/4HANA).
      Combines GL accounts (stg_ska1_s4), cost centers (stg_csks_s4),
      and business partners (stg_bp) into a single reference.
      Used for lookups, filters, and drill-downs in reports.
    columns:
      - name: master_data_type
        tests:
          - not_null
          - accepted_values:
              values: ['GL_ACCOUNT', 'COST_CENTER', 'VENDOR']
      - name: entity_id
        tests: [not_null]
